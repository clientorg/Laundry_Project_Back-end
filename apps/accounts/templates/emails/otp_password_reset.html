<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset OTP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      padding: 30px;
      text-align: center; 
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 35px 30px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
    }

    .title {
      font-size: 24px;
      color: #2d3436;
      margin-bottom: 15px;
      font-weight: 600;
      text-align: center; 
    }

    .message {
      font-size: 15px;
      color: #636e72;
      line-height: 22px;
      margin-bottom: 20px;
      text-align: center; 
    }

    .otp {
    display: inline-block;
    background: #f1f8ff;
    padding: 12px 25px;
    font-size: 30px;
    letter-spacing: 6px;
    border-radius: 8px;
    font-weight: bold;
    color: #0984e3;
    margin: 20px auto;     
    border: 1px solid #dfe6e9;
    text-align: center;
    display: block;       
    width: fit-content;    
  }


    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #838586;
      text-align: center; 
    }
  </style>

</head>

<body>

  <div class="container">

    <h2 class="title">Password Reset OTP</h2>

    <p class="message">
      Hello <strong>{{ username }}</strong>,<br>
      Your One-Time Password (OTP) to reset your account password is:
    </p>

    <div class="otp">{{ otp }}</div>

    <p class="message">
      This OTP is valid for <strong>{{ expiry_minutes }} minutes</strong>.<br>
    </p>

    <div class="footer">
      Thanks,<br>
      <strong>Laundry Team</strong>
    </div>

  </div>

</body>
</html>
